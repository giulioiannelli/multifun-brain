[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multifunbrain"
version = "0.2.0"
description = "Research toolkit for hierarchical modular brain networks"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Multifun-Brain Developers"}]
keywords = ["brain networks", "graph theory", "neuroscience", "modelling", "synthetic data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "networkx>=3.0",
    "matplotlib>=3.6",
    "nilearn>=0.10",
    "plotly>=5.0",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
viz = [
    "plotly>=5.0",
    "matplotlib>=3.6",
    "nilearn>=0.10",
]

[project.urls]
Homepage = "https://github.com/your-org/multifun-brain"
Documentation = "https://github.com/your-org/multifun-brain/tree/main/docs"
Source = "https://github.com/your-org/multifun-brain"
Issues = "https://github.com/your-org/multifun-brain/issues"

[project.scripts]
multifunbrain = "multifunbrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multifunbrain*"]

[tool.setuptools.package-data]
multifunbrain = ["py.typed"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["multifunbrain"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["test"]
